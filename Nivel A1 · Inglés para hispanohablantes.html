<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nivel A1 · Inglés para hispanohablantes</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#3b3a37;--mute:#7a766e;--line:#e5dccb;--acc:#a8845a;--accs:#efe4d2;--ok:#5f8a63;--bad:#b4574f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#25231f;--card:#2f2c27;--ink:#efe9dd;--mute:#a59e90;--line:#443f37;--acc:#cfa974;--accs:#3d372d;--ok:#8fbf93;--bad:#d98d85}}
:root[data-theme="dark"]{--bg:#25231f;--card:#2f2c27;--ink:#efe9dd;--mute:#a59e90;--line:#443f37;--acc:#cfa974;--accs:#3d372d;--ok:#8fbf93;--bad:#d98d85}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:980px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.logo{font-weight:700;letter-spacing:.3px;white-space:nowrap}.logo span{color:var(--acc)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;color:var(--mute);padding:8px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
nav button:hover{background:var(--accs)}nav button.on{background:var(--accs);color:var(--ink);font-weight:600}
main{max-width:980px;margin:auto;padding:24px 16px 60px}
h1{font-size:clamp(24px,5vw,34px);margin:0 0 6px;font-weight:650}h2{font-size:20px;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 22px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card.link{cursor:pointer;text-align:left;font:inherit;color:inherit;transition:.15s}.card.link:hover{border-color:var(--acc);transform:translateY(-2px)}
.card small{color:var(--mute)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--accs);color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}
.prog{height:10px;background:var(--accs);border-radius:99px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;background:var(--acc)}
.hero{display:grid;gap:14px;grid-template-columns:1.4fr 1fr;margin-bottom:22px}@media(max-width:720px){.hero{grid-template-columns:1fr}}
.big{font-size:44px;font-weight:700;color:var(--acc);line-height:1}
.en{font-style:italic;color:var(--acc)}
.ex{border-left:3px solid var(--acc);padding:4px 12px;margin:10px 0;background:var(--accs);border-radius:0 8px 8px 0}
table{width:100%;border-collapse:collapse}td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.wrap{overflow-x:auto}
.opts{display:grid;gap:8px;margin:14px 0}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{display:inline-block;font-size:12px;background:var(--accs);border-radius:99px;padding:2px 10px;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card ul{margin:6px 0 10px;padding-left:18px}.card .tag{margin:2px 4px 2px 0}.nav2{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.srch{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}.q{margin:18px 0}.fb{font-size:14px}.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.wrong{text-decoration:line-through;color:var(--bad)}.right{color:var(--ok);font-weight:600}.opt:disabled{cursor:default;color:var(--ink)}.btn.sm{padding:7px 12px;font-size:14px}.vg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}.ref{opacity:.7}.fcard{text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center}.fcard .vg{text-align:left;width:100%}.opt.sel{border-color:var(--acc);background:var(--accs)}.btn:disabled{opacity:.4}.icon{background:none;border:0;font-size:24px;cursor:pointer;color:var(--acc);padding:0 4px;line-height:1}
</style>
</head>
<body>
<header><div class="bar"><div class="logo">Nivel <span>A1</span></div><nav id="nav"></nav></div></header>
<main id="app"></main>
<script>
/* ===== CONTENIDO (amplía aquí: solo añade objetos a estas listas) ===== */

units:[

  {id:"u1l1",t:"Saludar y despedirse",body:`<p>Saludos básicos según el momento del día:</p><div class="ex"><span class="en">Hello! / Hi!</span> — Hola<br><span class="en">Good morning.</span> — Buenos días<br><span class="en">Good night.</span> — Buenas noches<br><span class="en">Goodbye! / Bye!</span> — Adiós</div>`},
  {id:"u1l2",t:"Presentarse",body:`<p>Para decir tu nombre y de dónde eres:</p><div class="ex"><span class="en">My name is Andrés.</span> — Me llamo Andrés.<br><span class="en">I’m from Colombia.</span> — Soy de Colombia.<br><span class="en">Nice to meet you.</span> — Mucho gusto.</div>`}]},
 {id:"u2",n:2,t:"Datos personales y verbo to be",en:"Personal information and verb to be",obj:["Dar tus datos personales","Usar am / is / are"],temas:["Pronombres","Verbo to be","Edad y nacionalidad"],gram:["Pronombres personales"],lessons:[]},
 {id:"u3",n:3,t:"Familia, personas y posesivos",en:"Family, people and possessives",obj:["Hablar de tu familia","Usar my / your / his / her"],temas:["Miembros de la familia","Adjetivos posesivos","Describir personas"],cat:"Familia",ex:[["This is my sister.","Esta es mi hermana."]],lessons:[
  {id:"u2l1",t:"Miembros de la familia",body:`<div class="ex"><span class="en">mother, father</span> — madre, padre<br><span class="en">brother, sister</span> — hermano, hermana<br><span class="en">This is my sister.</span> — Esta es mi hermana.</div>`}]},
 {id:"u4",n:4,t:"Objetos, artículos y demostrativos",en:"Objects, articles and demonstratives",obj:["Nombrar objetos cotidianos","Usar a / an y this / that"],temas:["Objetos del día a día","Artículos a / an / the","This, that, these, those"],gram:["Artículos a / an"],lessons:[]},
 {id:"u5",n:5,t:"Rutinas diarias y presente simple",en:"Daily routines and present simple",obj:["Describir tu rutina","Conjugar el presente simple"],temas:["Verbos de rutina","I / you / we / they + verbo","He / she / it + -s"],lessons:[]},
 {id:"u6",n:6,t:"Hora, fechas y preposiciones",en:"Time, dates and prepositions",obj:["Decir la hora y la fecha","Usar at / on / in"],temas:["La hora","Días y meses","Preposiciones de tiempo"],lessons:[]},
 {id:"u7",n:7,t:"Comida, bebidas y cantidades",en:"Food, drinks and quantities",obj:["Pedir comida y bebida","Hablar de cantidades"],temas:["Alimentos y bebidas","Some / any","How much / How many"],lessons:[]},
 {id:"u8",n:8,t:"Habilidades, pasatiempos y can/can’t",en:"Abilities, hobbies and can/can’t",obj:["Hablar de lo que sabes hacer","Expresar gustos"],temas:["Hobbies","Can / can’t","Like + verbo-ing"],lessons:[]},
 {id:"u9",n:9,t:"Ciudad, direcciones y there is/are",en:"City, directions and there is/are",obj:["Describir una ciudad","Pedir y dar direcciones"],temas:["Lugares de la ciudad","There is / there are","Turn left, go straight"],lessons:[]},
 {id:"u10",n:10,t:"Compras, ropa y precios",en:"Shopping, clothes and prices",obj:["Comprar ropa","Preguntar y decir precios"],temas:["Ropa y colores","How much is…?","Números grandes"],lessons:[]},
 {id:"u11",n:11,t:"Presente continuo",en:"Present continuous",obj:["Hablar de lo que ocurre ahora","Formar am / is / are + -ing"],temas:["Acciones en curso","Forma afirmativa y negativa","Preguntas"],lessons:[]},
 {id:"u12",n:12,t:"Repaso y proyecto final",en:"Review and final project",obj:["Repasar las unidades 1–11","Presentar un proyecto final"],temas:["Repaso general","Proyecto: presentarte","Autoevaluación"],lessons:[]}
],
grammar:[
 {t:"Pronombres personales",body:`<p>Sustituyen al nombre de la persona.</p><div class="wrap"><table><tr><th>Inglés</th><th>Español</th></tr><tr><td class="en">I</td><td>yo</td></tr><tr><td class="en">you</td><td>tú / usted</td></tr><tr><td class="en">he / she / it</td><td>él / ella / eso</td></tr><tr><td class="en">we</td><td>nosotros</td></tr><tr><td class="en">they</td><td>ellos / ellas</td></tr></table></div><p><small>En inglés el sujeto casi siempre es obligatorio: <span class="en">I live here</span>, no «live here».</small></p>`},
 {t:"Artículos a / an",body:`<p>Se usa <b class="en">a</b> antes de sonido consonante y <b class="en">an</b> antes de sonido vocálico.</p><div class="ex"><span class="en">a book</span> — un libro<br><span class="en">an apple</span> — una manzana</div>`}
],
vocab:[
 {c:"Saludos",w:[["hola","hello"],["adiós","goodbye"],["gracias","thank you"],["por favor","please"],["lo siento","sorry"]]},
 {c:"Familia",w:[["madre","mother"],["padre","father"],["hermano","brother"],["hermana","sister"],["amigo","friend"]]},
 {c:"Colores",w:[["rojo","red"],["azul","blue"],["verde","green"],["negro","black"],["blanco","white"]]}
],
verbs:[
 {v:"to be",es:"ser / estar",rows:[["I","am","I am a student."],["you","are","You are my friend."],["he / she / it","is","She is from Colombia."],["we","are","We are happy."],["they","are","They are at home."]]},
 {v:"to have",es:"tener",rows:[["I","have","I have a brother."],["you","have","You have a book."],["he / she / it","has","He has a car."],["we","have","We have a house."],["they","have","They have two cats."]]}
],
tests:[{id:"u1",t:"Evaluación · Unidad 1",qs:[
 {q:"¿Cómo se dice «Buenos días»?",o:["Good night","Good morning","Goodbye"],a:1},
 {q:"Completa: My name ___ Ana.",o:["am","are","is"],a:2},
 {q:"¿Qué significa «Nice to meet you»?",o:["Mucho gusto","Hasta luego","Lo siento"],a:0},
 {q:"Completa: I ___ from Colombia.",o:["am","is","are"],a:0}]}]
};
/* ===== ESTADO (se guarda en este navegador) ===== */
let S={done:{},last:null,scores:[]};
try{const r=localStorage.getItem("nivelA1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("nivelA1",JSON.stringify(S))}catch(e){}};
const lessons=()=>D.units.flatMap(u=>u.lessons.map(l=>({...l,u:"Unidad "+u.n+" · "+u.t,uid:u.id})));
const pct=()=>{const n=lessons().length;return n?Math.round(lessons().filter(l=>S.done[l.id]).length/n*100):0};
const $=s=>document.querySelector(s),app=$("#app");
const SEC=[["inicio","Inicio"],["unidades","Unidades"],["gramatica","Gramática"],["vocabulario","Vocabulario"],["verbos","Verbos"],["practica","Práctica"],["evaluaciones","Evaluaciones"],["progreso","Mi progreso"]];
let sub={},Q=null;
$("#nav").innerHTML=SEC.map(([k,n])=>`<button data-go="${k}">${n}</button>`).join("");
const go=k=>{location.hash=k};
function route(){const k=SEC.some(s=>s[0]===location.hash.slice(1))?location.hash.slice(1):"inicio";
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===k));
 Q=null;R[k]();window.scrollTo(0,0)}
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
/* ===== VISTAS ===== */
const R={
inicio(){const L=lessons().find(l=>l.id===S.last);
 app.innerHTML=`<h1>¡Bienvenido, a aprender inglés!</h1><p class="sub">Tu camino al nivel A1, paso a paso y en español.</p>
 <div class="hero"><div class="card"><small>Avance del curso</small><div class="big">${pct()}%</div><div class="prog"><i style="width:${pct()}%"></i></div><small>${lessons().filter(l=>S.done[l.id]).length} de ${lessons().length} lecciones completadas</small></div>
 <div class="card"><small>Última lección</small><h2>${L?L.t:"Aún no has empezado"}</h2><p class="sub" style="margin-bottom:14px">${L?L.u:"Empieza por la Unidad 1."}</p><button class="btn" data-open="${L?L.id:"u1l1"}">${L?"Continuar":"Empezar"}</button></div></div>
 <h2>Acceso rápido</h2><div class="grid">${SEC.slice(1).map(([k,n])=>`<button class="card link" data-go="${k}"><b>${n}</b></button>`).join("")}</div>`},
unidades(){
 if(sub.u&&!sub.l){unitView();return}
 if(sub.l){const l=lessons().find(x=>x.id===sub.l);S.last=l.id;save();
  app.innerHTML=`<button class="btn ghost" data-unit="${l.uid}">← ${l.u}</button><h1 style="margin-top:16px">${l.t}</h1><p class="sub">${l.u}</p><div class="card">${l.body}</div><p><button class="btn" data-done="${l.id}">${S.done[l.id]?"✓ Completada (quitar)":"Marcar como completada"}</button></p>`;return}
 app.innerHTML=`<h1>Unidades</h1><p class="sub">12 unidades progresivas de nivel A1.</p><div class="grid">${D.units.map(u=>`<div class="card"><small>Unidad ${u.n}</small><h2>${u.t}</h2><p class="en" style="margin:0 0 8px">${u.en}</p><b>Objetivos</b><ul>${u.obj.map(o=>`<li>${o}</li>`).join("")}</ul><div>${u.temas.map(t=>`<span class="tag">${t}</span>`).join("")}</div><p><b>Estado:</b> ${unitStatus(u)}</p><button class="btn" data-unit="${u.id}">Entrar</button></div>`).join("")}</div>`},
gramatica(){GS.open=null;gView()},
vocabulario(){vView()},
verbos(){vbView()},
practica(){const n=D.vocab.reduce((a,v)=>a+v.w.length,0);
 app.innerHTML=`<h1>Práctica</h1><p class="sub">Vocabulario aleatorio · 5 preguntas.</p><div class="card"><p>Traduce palabras del español al inglés usando las categorías de Vocabulario (${n} palabras disponibles).</p><button class="btn" data-quiz="practica">Empezar práctica</button></div>`},
evaluaciones(){app.innerHTML=`<h1>Evaluaciones</h1><p class="sub">Pon a prueba lo aprendido.</p>`+D.tests.map(t=>{const b=S.scores.filter(s=>s.id===t.id).map(s=>s.p);return `<div class="card" style="margin-bottom:14px"><h2>${t.t}</h2><p class="sub" style="margin-bottom:12px">${t.qs.length} preguntas${b.length?" · mejor resultado: "+Math.max(...b)+"%":""}</p><button class="btn" data-quiz="${t.id}">Comenzar</button></div>`}).join("")},
progreso(){const h=S.scores.slice(-8).reverse();
 app.innerHTML=`<h1>Mi progreso</h1><p class="sub">Se guarda en este navegador.</p><div class="card" style="margin-bottom:14px"><div class="big">${pct()}%</div><div class="prog"><i style="width:${pct()}%"></i></div>${D.units.map(u=>`<p style="margin:6px 0"><b>Unidad ${u.n} · ${u.t}</b><br><small>${u.lessons.length?u.lessons.filter(l=>S.done[l.id]).length+" de "+u.lessons.length+" lecciones":"Sin lecciones todavía"}</small></p>`).join("")}</div>
 <div class="card" style="margin-bottom:14px"><h2>Gramática</h2><p class="sub" style="margin:0">${gramSummary()}</p></div>
 <div class="card" style="margin-bottom:14px"><h2>Vocabulario</h2><p class="sub" style="margin:0">${vocSummary()}</p></div>
 <div class="card" style="margin-bottom:14px"><h2>Verbos</h2><p class="sub" style="margin:0">${vbSummary()}</p></div>
 <div class="card"><h2>Últimos resultados</h2>${h.length?`<table>${h.map(s=>`<tr><td>${s.t}</td><td>${s.p}%</td><td><small>${s.d}</small></td></tr>`).join("")}</table>`:"<p class='sub'>Aún no has hecho ninguna práctica o evaluación.</p>"}<p><button class="btn ghost" data-reset>Borrar mi progreso</button></p></div>`}
};
function unitStatus(u){const n=u.lessons.length,d=u.lessons.filter(l=>S.done[l.id]).length;return !n?"Pendiente (sin contenido aún)":d===n?"Completada":d?`En curso · ${d} de ${n} lecciones`:`Sin empezar · ${n} lecciones`}
function unitView(){const i=D.units.findIndex(x=>x.id===sub.u),u=D.units[i],t=sub.t||"lecciones",pv=D.units[i-1],nx=D.units[i+1];
 const cat=D.vocab.find(v=>v.c===u.cat),gr=(u.gram||[]).map(g=>D.grammar.find(x=>x.t===g)).filter(Boolean),E=m=>`<p class="sub">${m}</p>`;
 const TABS=[["lecciones","Lecciones"],["vocabulario","Vocabulario"],["gramatica","Gramática"],["ejemplos","Ejemplos"],["ejercicios","Ejercicios"]];

  vocabulario:cat?`<div class="grid">${cat.w.map(w=>`<div class="card"><b class="en">${w[1]}</b><br><small>${w[0]}</small></div>`).join("")}</div>`:E("Vocabulario pendiente de añadir."),

 app.innerHTML=`<div class="row"><button class="btn ghost" data-go="unidades">← Unidades</button><button class="btn ghost" data-go="inicio">Inicio</button></div><h1 style="margin-top:16px">Unidad ${u.n} · ${u.t}</h1><p class="sub"><span class="en">${u.en}</span> · ${unitStatus(u)}</p><div class="chips">${TABS.map(x=>`<button class="btn ${x[0]===t?"":"ghost"}" data-tab="${x[0]}">${x[1]}</button>`).join("")}</div><div class="card">${P[t]}</div><div class="nav2">${pv?`<button class="btn ghost" data-unit="${pv.id}">← Unidad ${pv.n}</button>`:""}${nx?`<button class="btn ghost" data-unit="${nx.id}">Unidad ${nx.n} →</button>`:""}</div>`}
/* ===== MÓDULO GRAMÁTICA A1 (ordenado por dificultad; q = "enunciado|opción/opción/opción|índice correcto") ===== */
const GL={1:"Básico",2:"Intermedio",3:"Avanzado"},gp=()=>S.gram||(S.gram={}),nz=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const GT=(id,t,lv,cat,exp,est,ex,err,q)=>({id,t,lv,cat,exp,est,ex,err,q:q.map(s=>{const p=s.split("|");return{s:p[0],o:p[1].split("/"),a:+p[2]}})});
D.gram=[
GT("pron","Pronombres personales y objeto",1,"Pronombres","Los pronombres sujeto (I, you, he, she, it, we, they) van antes del verbo. Los pronombres objeto (me, you, him, her, it, us, them) van después del verbo o de una preposición.","Sujeto + verbo + objeto: I see him. / She talks to us.",[["I love her.","Yo la quiero."],["They help us.","Ellos nos ayudan."],["Give it to me.","Dámelo."]],[["Me am tired.","I am tired.","Como sujeto se usa I, no me."],["I see he.","I see him.","Tras el verbo va el pronombre objeto."]],["___ am a student.|I/Me/My|0","Maria is my friend. I like ___.|she/her/hers|1","Tom and I are friends. ___ are happy.|We/Us/Our|0","Can you help ___? (a mí)|I/me/my|1","This is a book. I read ___ every day.|it/its/they|0"]),
GT("tobe","Verbo to be",1,"Verbos","To be significa ser o estar y cambia según el sujeto: I am, you are, he/she/it is, we/you/they are. Contracciones habituales: I’m, you’re, she’s.","Sujeto + am / is / are + complemento",[["I am from Colombia.","Soy de Colombia."],["She is a teacher.","Ella es profesora."],["They are at home.","Ellos están en casa."]],[["I have 20 years.","I am 20 years old.","La edad se dice con to be, no con have."],["She are tall.","She is tall.","Con she va is."]],["She ___ my sister.|am/is/are|1","We ___ in Bogotá.|am/is/are|2","I ___ 25 years old.|am/is/are|0","The books ___ on the table.|is/are/am|1","It ___ cold today.|are/is/am|1"]),
GT("afneg","Afirmaciones, negaciones y preguntas",1,"Oraciones","Con to be la negación añade not y la pregunta invierte el orden (Are you…?). Con los demás verbos se usan los auxiliares do/does (ver presente simple).","+ She is happy. · − She is not (isn’t) happy. · ? Is she happy?",[["He is not a doctor.","Él no es médico."],["Are you ready?","¿Estás listo?"],["Yes, I am. / No, I’m not.","Sí. / No."]],[["You are ready?","Are you ready?","En la pregunta el verbo va antes del sujeto."],["She no is here.","She is not here.","La negación es not después de to be."]],["Negativa: He ___ a student.|isn’t/doesn’t/no|0","Pregunta: ___ they at school?|Is/Are/Do|1","Ordena: you / are / happy → ___ ?|Are you happy/You are happy/Happy are you|0","Completa: I ___ not tired.|am/is/are|0","Respuesta corta: Is she a nurse? No, she ___.|isn’t/doesn’t/not|0"]),
GT("art","Artículos a / an / the",1,"Determinantes","A / an significan «un / una» y se usan con sustantivos singulares no específicos; an va antes de sonido vocal. The equivale a «el / la / los / las» y se usa con algo ya conocido o único.","a + sonido consonante · an + sonido vocal · the + sustantivo conocido",[["She has a dog.","Ella tiene un perro."],["I eat an apple.","Como una manzana."],["The dog is big.","El perro es grande."]],[["a apple","an apple","Apple empieza con sonido vocal."],["a hour","an hour","La h de hour es muda: suena vocal."]],["I have ___ umbrella.|a/an/the|1","She is ___ teacher.|a/an/the|0","___ sun is hot. (único)|A/An/The|2","He wants ___ orange.|a/an/the|1","I saw a film. ___ film was great.|A/An/The|2"]),
GT("plur","Plurales",1,"Sustantivos","Normalmente se añade -s. Si termina en s, x, ch o sh se añade -es; si termina en consonante + y, la y cambia a -ies. Algunos plurales son irregulares.","book → books · box → boxes · city → cities · man → men",[["two cats","dos gatos"],["three boxes","tres cajas"],["The children play.","Los niños juegan."]],[["two childs","two children","Child es irregular."],["a cities","a city","Con a se usa el singular."]],["Plural de box: ___|boxs/boxes/boxies|1","Plural de city: ___|citys/cities/cityes|1","Plural de man: ___|mans/men/manes|1","Plural de baby: ___|babies/babys/babyes|0","Plural de child: ___|childs/childes/children|2"]),
GT("pos","Posesivos: my, your, his, her, its, our, their",2,"Determinantes","Van antes del sustantivo y concuerdan con el poseedor, no con la cosa poseída: his book (de él), her book (de ella).","Posesivo + sustantivo (sin artículo): my car",[["This is my house.","Esta es mi casa."],["She loves her dog.","Ella quiere a su perro."],["Our friends are here.","Nuestros amigos están aquí."]],[["The my car","My car","No se usa the con posesivos."],["Maria loves his mother.","Maria loves her mother.","La poseedora es femenina: her."]],["I like ___ job. (yo)|my/me/mine|0","John and ___ wife are here. (de John)|her/his/their|1","The dog eats ___ food. (del perro)|it/its/his|1","We love ___ teacher. (nuestro)|our/we/us|0","They bring ___ books. (de ellos)|them/their/there|1"]),
GT("dem","This, that, these, those",2,"Determinantes","Señalan según cercanía y número: this / these para lo cercano; that / those para lo lejano. This y that van con singular; these y those con plural.","this / that + singular · these / those + plural",[["This is my pen.","Este es mi bolígrafo."],["Those shoes are nice.","Esos zapatos son bonitos."],["Is that your bag?","¿Esa es tu bolsa?"]],[["This books","These books","Plural cercano: these."],["Those is my car","That is my car","Singular lejano: that."]],["___ is my phone. (cerca, singular)|This/These/Those|0","___ are my keys. (cerca, plural)|This/These/That|1","Look at ___ mountain! (lejos)|that/those/these|0","___ cats over there are cute.|That/Those/This|1","Is ___ your coat here? (cerca)|these/those/this|2"]),
GT("have","Have / has",2,"Verbos","Have significa tener. Con he, she, it se usa has; con los demás sujetos, have. Negación y pregunta con do/does: I don’t have…, Does she have…?","I / you / we / they have · he / she / it has",[["I have a sister.","Tengo una hermana."],["He has two cars.","Él tiene dos carros."],["Do you have a pen?","¿Tienes un bolígrafo?"]],[["She have a cat.","She has a cat.","Con she va has."],["Does she has a car?","Does she have a car?","Tras does el verbo va en forma base."]],["She ___ a new phone.|have/has/haves|1","They ___ two children.|have/has/having|0","My dog ___ a ball.|have/has/are|1","Do you ___ a pencil?|have/has/had|0","He doesn’t ___ a car.|has/have/having|1"]),
GT("there","There is / there are",2,"Oraciones","Sirve para decir que algo existe («hay»). There is se usa con singular e incontables; there are con plurales.","+ There is a park. · − There isn’t a park. · ? Is there a park? · There are two parks.",[["There is a bank here.","Hay un banco aquí."],["There are two parks.","Hay dos parques."],["Is there a school near here?","¿Hay una escuela cerca?"]],[["Have a park here.","There is a park here.","Para «hay» no se usa have."],["There is two cats.","There are two cats.","Con plural: there are."]],["There ___ a cat on the sofa.|is/are/have|0","There ___ three bags.|is/are/has|1","___ there a bank near here?|Are/Is/Do|1","There ___ any milk. (negativa)|isn’t/aren’t/don’t|0","There ___ many people.|is/are/be|1"]),
GT("can","Can / can’t",2,"Verbos","Can expresa habilidad o permiso. Es igual para todos los sujetos y va seguido del verbo en forma base, sin to.","+ I can swim. · − I can’t swim. · ? Can you swim?",[["She can sing.","Ella sabe cantar."],["I can’t drive.","No sé conducir."],["Can I come in?","¿Puedo entrar?"]],[["He cans swim.","He can swim.","Can no cambia con he/she/it."],["I can to swim.","I can swim.","Sin to después de can."]],["She ___ speak French.|can/cans/cans to|0","I ___ swim. (no sé)|can’t/don’t can/not can|0","___ you help me?|Do/Can/Are|1","He can ___ the piano.|plays/play/to play|1","They ___ come today. (no pueden)|can’t/aren’t/doesn’t|0"]),
GT("some","Some / any",2,"Cantidad","Some se usa en afirmaciones; any en negaciones y preguntas. En ofrecimientos y peticiones también se usa some.","+ some · − not any · ? any (Would you like some tea?)",[["I have some books.","Tengo algunos libros."],["I don’t have any money.","No tengo dinero."],["Do you have any milk?","¿Tienes leche?"]],[["I don’t have some friends.","I don’t have any friends.","En negativas se usa any."],["Is there some water?","Is there any water?","En preguntas normales se usa any."]],["I have ___ apples.|some/any/an|0","She doesn’t have ___ time.|some/any/a|1","Do you want ___ tea? (ofrecimiento)|any/some/an|1","Are there ___ chairs?|some/any/a|1","There are ___ eggs in the fridge.|any/some/an|1"]),
GT("simple","Presente simple y do / does",2,"Verbos","Expresa hábitos y hechos. Con he/she/it el verbo añade -s/-es. La negación y la pregunta usan don’t/doesn’t y do/does, y el verbo queda en forma base.","+ She works. · − She doesn’t work. · ? Does she work?",[["I work every day.","Trabajo todos los días."],["He doesn’t like tea.","No le gusta el té."],["Do they live here?","¿Viven aquí?"]],[["She work here.","She works here.","He/she/it llevan -s."],["He doesn’t likes it.","He doesn’t like it.","Tras doesn’t el verbo no lleva -s."]],["She ___ English every day.|study/studies/studys|1","I ___ like coffee.|don’t/doesn’t/not|0","___ he play football?|Do/Does/Is|1","They ___ in Cali.|lives/live/living|1","He doesn’t ___ TV.|watches/watch/watching|1"]),
GT("cont","Presente continuo",3,"Verbos","Describe acciones que ocurren ahora. Se forma con am / is / are + verbo con -ing.","Sujeto + am / is / are + verbo-ing",[["I am reading now.","Estoy leyendo ahora."],["She is cooking.","Ella está cocinando."],["Are they playing?","¿Están jugando?"]],[["I reading.","I am reading.","Falta el verbo to be."],["She is cook.","She is cooking.","El verbo lleva -ing."]],["I ___ a book now.|read/am reading/reading|1","They ___ football.|is playing/are playing/play|1","She ___ TV at the moment.|is watching/watches/are watching|0","___ you eating?|Is/Are/Do|1","He isn’t ___.|sleep/sleeping/sleeps|1"]),
GT("much","Much / many / a lot of",3,"Cantidad","Many va con contables en plural; much con incontables, sobre todo en negativas y preguntas. A lot of vale para ambos y es común en afirmativas.","many + plural · much + incontable · a lot of + ambos",[["How many books?","¿Cuántos libros?"],["I don’t have much time.","No tengo mucho tiempo."],["She has a lot of friends.","Tiene muchos amigos."]],[["I have much friends.","I have many friends.","Friends es contable: many."],["How many water?","How much water?","Water es incontable: much."]],["How ___ people are here?|much/many/a lot|1","How ___ milk do you need?|much/many/a lot|0","I don’t have ___ money.|many/much/some|1","She has ___ friends. (afirmativa)|much/a lot of/an|1","There aren’t ___ cars.|much/many/a|1"]),
GT("prep","Preposiciones de tiempo y lugar",3,"Preposiciones","Tiempo: at con horas, on con días y fechas, in con meses, años y partes del día. Lugar: in (dentro de), on (sobre), at (en un punto), under (debajo de).","at 5 o’clock · on Monday · in July · in the room · on the table",[["I wake up at 7.","Me despierto a las 7."],["The party is on Friday.","La fiesta es el viernes."],["The cat is under the bed.","El gato está debajo de la cama."]],[["I work in Monday.","I work on Monday.","Los días llevan on."],["See you on the morning.","See you in the morning.","Las partes del día llevan in."]],["The class starts ___ 9 o’clock.|at/on/in|0","My birthday is ___ May.|on/at/in|2","I have a meeting ___ Tuesday.|on/in/at|0","The book is ___ the table.|in/on/at|1","The keys are ___ my bag. (dentro)|on/in/at|1"]),
GT("adv","Adverbios de frecuencia",3,"Oraciones","Indican cada cuánto ocurre algo: always, usually, often, sometimes, never. Van antes del verbo principal y después de to be.","Sujeto + adverbio + verbo · Sujeto + be + adverbio",[["I always eat breakfast.","Siempre desayuno."],["She is never late.","Ella nunca llega tarde."],["We sometimes go out.","A veces salimos."]],[["I go always to school.","I always go to school.","El adverbio va antes del verbo."],["He never is late.","He is never late.","Con to be, va después del verbo."]],["She ___ drinks coffee. (siempre)|always/never/sometimes|0","He ___ late. (nunca)|is never/never is/never are|0","I ___ watch TV. (normalmente)|usually/usual/usually to|0","Cuál es correcta:|I am always happy/I always am happy/Always I am happy|0","We ___ go to the cinema. (a veces)|never/sometimes/always|1"]),
GT("wh","Preguntas con what, where, who, when, why y how",3,"Preguntas","Se colocan al inicio: what (qué), where (dónde), who (quién), when (cuándo), why (por qué), how (cómo). Después van el auxiliar o to be y el sujeto.","Wh- + am / is / are / do / does + sujeto + verbo",[["Where do you live?","¿Dónde vives?"],["Why is she sad?","¿Por qué está triste?"],["How are you?","¿Cómo estás?"]],[["Where you live?","Where do you live?","Falta el auxiliar do."],["What time does she starts?","What time does she start?","Tras does va el verbo base."]],["___ is your name? (qué)|What/Who/Where|0","___ do you live? (dónde)|When/Where/Why|1","___ is that man? (quién)|Who/What/How|0","___ do you study English? (por qué)|Why/When/How|0","___ are you? (cómo)|What/Where/How|2"])

function gAnswer(v){const [qi,oi]=v.split(",").map(Number),g=D.gram.find(x=>x.id===GS.open),a=GS.ans[g.id];if(a[qi]!==undefined)return;a[qi]=oi;

function mNew(){const it=shuffle(D.vb).slice(0,6);VB.m={it,ord:shuffle([0,1,2,3,4,5]),done:{},err:{},sel:null,first:0,msg:"",fin:false}}
function vbMW(i){const m=VB.m;if(m.done[i])return;m.sel=i;m.msg="";vbView()}
function vbMT(j){const m=VB.m;if(m.sel===null||m.done[j])return;if(m.sel===j){m.done[j]=1;if(!m.err[j])m.first++;m.msg="✓ Correcto";if(Object.keys(m.done).length===6){m.fin=true;sc2("verbos-relacionar","Verbos · relacionar",Math.round(m.first/6*100))}}else{m.err[m.sel]=1;m.msg="✗ Esa traducción no corresponde. Prueba otra vez."}m.sel=null;vbView()}
function vbMatch(){if(!VB.m)mNew();const m=VB.m;
 return `<div class="card"><p class="sub" style="margin:0 0 10px">Toca un verbo y luego su traducción.</p><div class="row" style="align-items:flex-start"><div style="flex:1;min-width:130px" class="opts">${m.it.map((v,i)=>`<button class="opt en ${m.done[i]?"ok":m.sel===i?"sel":""}" data-mw="${i}" ${m.done[i]?"disabled":""}>${v.b}</button>`).join("")}</div><div style="flex:1;min-width:130px" class="opts">${m.ord.map(j=>`<button class="opt ${m.done[j]?"ok":""}" data-mt="${j}" ${m.done[j]?"disabled":""}>${m.it[j].t}</button>`).join("")}</div></div><div class="fb ${m.msg[0]==="✓"?"ok-t":"bad-t"}">${m.msg}</div>${m.fin?`<p><b>Resultado: ${m.first} de 6 a la primera.</b></p><button class="btn" data-mn>Otra ronda</button>`:""}</div>`}
document.addEventListener("input",e=>{if(e.target.id==="vbq"){VB.q=e.target.value;vbList()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="fxi")fxCheck()});
/* ===== MOTOR DE PREGUNTAS ===== */
function startQuiz(id){let qs,t;
 if(id==="practica"){const all=D.vocab.flatMap(v=>v.w);t="Práctica de vocabulario";
  qs=shuffle(all).slice(0,5).map(w=>{const o=shuffle([w[1],...shuffle(all.filter(x=>x[1]!==w[1])).slice(0,2).map(x=>x[1])]);return{q:`¿Cómo se dice «${w[0]}» en inglés?`,o,a:o.indexOf(w[1])}})}
 else{const T=D.tests.find(x=>x.id===id);t=T.t;qs=T.qs}
 Q={id,t,qs,i:0,s:0,ans:false};drawQ()}
function drawQ(){if(Q.i>=Q.qs.length){const p=Math.round(Q.s/Q.qs.length*100);
  S.scores.push({id:Q.id,t:Q.t,p,d:new Date().toLocaleDateString("es")});save();
  app.innerHTML=`<h1>${Q.t}</h1><div class="card"><div class="big">${p}%</div><p>${Q.s} de ${Q.qs.length} respuestas correctas.</p><div class="row"><button class="btn" data-quiz="${Q.id}">Repetir</button><button class="btn ghost" data-go="progreso">Ver mi progreso</button></div></div>`;Q=null;return}
 const q=Q.qs[Q.i];
 app.innerHTML=`<h1>${Q.t}</h1><p class="sub">Pregunta ${Q.i+1} de ${Q.qs.length}</p><div class="card"><h2>${q.q}</h2><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-opt="${i}">${o}</button>`).join("")}</div><button class="btn" id="nx" data-next hidden>${Q.i+1<Q.qs.length?"Siguiente":"Ver resultado"}</button></div>`}
/* ===== EVENTOS ===== */
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.go){if(d.go==="unidades")sub={};if(location.hash.slice(1)===d.go)route();else go(d.go)}
 else if(d.unit){sub={u:d.unit,t:"lecciones"};if(location.hash!=="#unidades")go("unidades");else route()}
 else if(d.tab){sub.t=d.tab;unitView()}
 else if(d.gt){GS.open=d.gt;GS.ans[d.gt]=GS.ans[d.gt]||[];gView();window.scrollTo(0,0)}
 else if("gb" in d){GS.open=null;gView();window.scrollTo(0,0)}
 else if(d.gl){GS.lv=+d.gl;gView()}
 else if(d.gq){gAnswer(d.gq)}
 else if("gr" in d){GS.ans[GS.open]=[];gView()}
 else if(d.vr){VS.rev[d.vr]=!VS.rev[d.vr];vList()}
 else if(d.vf){const o=vp(d.vf);o.f=o.f?0:1;save();vList()}
 else if(d.vs){const [i,t]=d.vs.split(":"),o=vp(i);o.s=o.s===t?"":t;save();vList()}
 else if(d.vl){VS.f=d.vl;vView()}
 else if(d.vbt){VB.tab=d.vbt;vbView()}
 else if(d.vbf){VB.f=d.vbf;VB.ci=0;VB.show=false;vbView()}
 else if(d.vbc){vbCard(d.vbc)}
 else if("fxs" in d){fxStart()}
 else if("fxc" in d){fxCheck()}
 else if("fxn" in d){fxNext()}
 else if(d.mw){vbMW(+d.mw)}
 else if(d.mt){vbMT(+d.mt)}
 else if("mn" in d){mNew();vbView()}
 else if(d.open){sub={l:d.open};if(location.hash!=="#unidades")go("unidades");else route()}
 else if("done" in d){S.done[d.done]=!S.done[d.done];save();R.unidades()}
 else if(d.cat){sub={c:+d.cat};R.vocabulario()}
 else if(d.quiz)startQuiz(d.quiz)
 else if(d.opt!==undefined&&Q&&!Q.ans){Q.ans=true;const q=Q.qs[Q.i],i=+d.opt;if(i===q.a)Q.s++;
  document.querySelectorAll(".opt").forEach((o,j)=>o.classList.add(j===q.a?"ok":j===i?"bad":"x"));$("#nx").hidden=false}
 else if("next" in d){Q.i++;Q.ans=false;drawQ()}
 else if("reset" in d){if(confirm("¿Borrar todo tu progreso?")){S={done:{},last:null,scores:[]};save();R.progreso()}}
});
document.addEventListener("input",e=>{if(e.target.id==="gs"){GS.q=e.target.value;gList()}else if(e.target.id==="gc"){GS.cat=e.target.value;gList()}});
addEventListener("hashchange",()=>{sub=location.hash==="#unidades"?sub:{};route()});
route();
</script>
</body>
</html>
